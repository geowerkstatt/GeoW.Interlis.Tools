name: Pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NUGET_SOURCE: https://nuget.pkg.github.com/GeoWerkstatt/index.json
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-pre-release:
    runs-on: ubuntu-latest
    name: Build and push NuGet package and create a new GitHub pre-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set environment variables
        run: |
          echo VERSION=$(grep -oP "(?<=<VersionPrefix>)[^<]+" Directory.Build.props).$GITHUB_RUN_NUMBER >> $GITHUB_ENV

      - name: Build NuGet package
        run: dotnet pack -c Release --include-symbols -p:Version=${{ env.VERSION }}

      - name: Publish NuGet package
        run: dotnet nuget push ./artifacts/*.nupkg -k ${GITHUB_TOKEN} -s ${{ env.NUGET_SOURCE }} --skip-duplicate

      - name: Create GitHub pre-release
        run: |
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/releases \
            -f tag_name='v${{ env.VERSION }}' \
            -f target_commitish='main' \
            -f name='${{ env.VERSION }}' \
            -F prerelease=true \
